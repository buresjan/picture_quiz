let pool = [];
let index = 0;
let right = Number(localStorage.getItem('quizRight') || 0);
let wrong = Number(localStorage.getItem('quizWrong') || 0);
const img = document.getElementById('cardImage');
const answer = document.getElementById('answer');
const meta = document.getElementById('meta');
const count = document.getElementById('count');
const score = document.getElementById('score');
const eraFilter = document.getElementById('eraFilter');

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}
function setupFilter() {
  const eras = Array.from(new Set(CARDS.map(c => c.era).filter(Boolean))).sort();
  eraFilter.innerHTML = '<option value="">Všechna období</option>' + eras.map(e => `<option>${e}</option>`).join('');
}
function rebuildPool() {
  const era = eraFilter.value;
  pool = CARDS.filter(c => !era || c.era === era);
  shuffle(pool);
  index = 0;
  showCard();
}
function current() { return pool[index % pool.length]; }
function showCard() {
  if (!pool.length) return;
  const card = current();
  img.src = card.image;
  img.alt = card.answer;
  answer.textContent = card.answer;
  answer.classList.remove('visible');
  meta.textContent = [card.era, card.source, card.source_page ? `str. ${card.source_page}` : '', card.topic].filter(Boolean).join(' • ');
  updateStats();
}
function updateStats() {
  count.textContent = pool.length ? `${index + 1} / ${pool.length}` : '0 / 0';
  score.textContent = `Správně: ${right} • Špatně: ${wrong}`;
  localStorage.setItem('quizRight', right);
  localStorage.setItem('quizWrong', wrong);
}
document.getElementById('showBtn').onclick = () => answer.classList.add('visible');
document.getElementById('nextBtn').onclick = () => { index = (index + 1) % pool.length; showCard(); };
document.getElementById('shuffleBtn').onclick = rebuildPool;
document.getElementById('rightBtn').onclick = () => { right++; index = (index + 1) % pool.length; showCard(); };
document.getElementById('wrongBtn').onclick = () => { wrong++; index = (index + 1) % pool.length; showCard(); };
document.getElementById('resetBtn').onclick = () => { right = 0; wrong = 0; updateStats(); };
eraFilter.onchange = rebuildPool;
document.addEventListener('keydown', (ev) => {
  if (ev.key === ' ') { ev.preventDefault(); answer.classList.contains('visible') ? document.getElementById('nextBtn').click() : document.getElementById('showBtn').click(); }
  if (ev.key === '1') document.getElementById('wrongBtn').click();
  if (ev.key === '2') document.getElementById('rightBtn').click();
});
setupFilter();
rebuildPool();
</script>
